[project]
name = "willow"
version = "0.1.0"
description = "Willow: an early-warning weekly check-in for older adults and caregivers (NHATS-trained)"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "scikit-learn>=1.4", "matplotlib", "pyyaml", "pyarrow", "xgboost", "shap"]

[project.optional-dependencies]
dev = ["pytest", "ipykernel", "nbformat", "nbclient"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
